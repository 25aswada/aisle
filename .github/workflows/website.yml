name: Website

# Builds shopaisle.app from website/ (legal text from backend/app/legal.py) and
# publishes it with GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "backend/app/legal.py"
      - "ios/Aisle/Assets.xcassets/AisleLogo.imageset/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: python3 website/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public
      - id: deployment
        uses: actions/deploy-pages@v4
