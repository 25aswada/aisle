[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisle-backend"
version = "0.1.0"
requires-python = ">=3.10"

# The app is imported as `backend.app` from the repo root (see pythonpath
# below), so the editable install CI performs only needs to succeed; it
# does not need to package any modules.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = [".."]
