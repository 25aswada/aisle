name: Aisle
options:
  bundleIdPrefix: app.shopaisle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.92.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    # Override per-configuration or on the xcodebuild command line.
    AISLE_API_BASE_URL: "http://127.0.0.1:8000"
    # Sign in with Google (iOS OAuth client in Cloud project aisle-510605). Not a secret.
    AISLE_GOOGLE_CLIENT_ID: "192788314882-d6e46f6nv0nc8b00iaomfv57pgr65js9.apps.googleusercontent.com"
    # RevenueCat's public iOS SDK key (appl_...), for purchase analytics. Not a secret.
    # Empty turns RevenueCat off.
    AISLE_REVENUECAT_API_KEY: ""
  configs:
    # Release builds talk to the Heroku app; Debug stays on this Mac (Config/Local.xcconfig).
    Release:
      AISLE_API_BASE_URL: "https://aisle-api-db30672cd6aa.herokuapp.com"
targets:
  Aisle:
    type: application
    platform: iOS
    sources:
      - path: Aisle
        excludes: [Aisle.storekit]
      # Local StoreKit testing only; referenced by the scheme, never shipped in the app.
      - path: Aisle/Aisle.storekit
        buildPhase: none
    dependencies:
      - package: RevenueCat
    configFiles:
      Debug: Config/Debug.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shopaisle.aisle
        # Akshaj Satyawada's team; Sign in with Apple needs the app ID registered here.
        DEVELOPMENT_TEAM: 983N58VUTZ
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        # Near-black ink accent with a light variant for dark mode (Assets.xcassets).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Sign in with Apple, and invite links (https://shopaisle.app/join/CODE) that open the
        # app; the site serves /.well-known/apple-app-site-association (website/build.py).
        CODE_SIGN_ENTITLEMENTS: Aisle/Aisle.entitlements
      configs:
        # Debug builds also ask for invite links in developer mode, so a phone with
        # Settings > Developer > Associated Domains Development on reads shopaisle.app's
        # file directly instead of Apple's cache.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Aisle/AisleDebug.entitlements
    info:
      path: Aisle/Info.plist
      properties:
        CFBundleDisplayName: Aisle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, Geist-Bold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AisleAPIBaseURL: $(AISLE_API_BASE_URL)
        AisleGoogleClientID: $(AISLE_GOOGLE_CLIENT_ID)
        AisleRevenueCatAPIKey: $(AISLE_REVENUECAT_API_KEY)
        NSCameraUsageDescription: >-
          Aisle uses the camera when you take a photo of something you want to find,
          so it can tell what it is and where it is in the store.
        NSLocationWhenInUseUsageDescription: >-
          Aisle uses your location only to show stores near you. This is
          optional: you can always search for a store by name or address instead.
        # Only standard HTTPS and hashing, which are exempt from export paperwork.
        ITSAppUsesNonExemptEncryption: false
        # aisle://join/CODE opens a shared-list invite (older invites; new ones are
        # https://shopaisle.app/join/CODE universal links).
        CFBundleURLTypes:
          - CFBundleURLName: app.shopaisle.aisle
            CFBundleURLSchemes: [aisle]
    # Debug builds can talk to a test server on this Mac or network (plain http on the
    # LAN). Release builds leave both keys out: the App Store app only uses HTTPS.
    postCompileScripts:
      - name: Allow a local test server (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          buddy=/usr/libexec/PlistBuddy
          $buddy -c "Delete :NSLocalNetworkUsageDescription" "$plist" 2>/dev/null || true
          $buddy -c "Add :NSLocalNetworkUsageDescription string 'Aisle can connect to a test server on your local network.'" "$plist"
          $buddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
          $buddy -c "Add :NSAppTransportSecurity dict" "$plist"
          $buddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
  AisleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AisleTests]
    dependencies:
      - target: Aisle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shopaisle.aisleTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Aisle:
    build:
      targets:
        Aisle: all
        AisleTests: [test]
    run:
      # Aisle+ subscriptions without App Store Connect (Xcode-launched runs only).
      storeKitConfiguration: Aisle/Aisle.storekit
    test:
      targets: [AisleTests]
      gatherCoverageData: false
