services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aisle
      POSTGRES_USER: aisle
      POSTGRES_PASSWORD: aisle_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aisle_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisle -d aisle"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aisle_postgres:
